[project]
name = "udi-mqtt-pg3x"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "udi-interface>=3.3.12",
    "pyyaml>=5.3.1",
    "paho-mqtt~=2.1.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
